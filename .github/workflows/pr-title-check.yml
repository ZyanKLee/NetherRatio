name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types (conventional commits spec)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            revert
          # Require a scope to be set: optional (remove to enforce)
          requireScope: false
          # Subject must not start with an uppercase letter
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >
            The subject "{subject}" must not start with an uppercase letter.
            Use lowercase: "{subject_lowercased}"
          # Disallow commit types used only by tooling
          disallowScopes:
            - release
